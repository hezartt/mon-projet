# Nom du workflow (apparaît dans l'onglet Actions)
name: Exemple de workflow

# Quand déclencher ce workflow ?
on:
  # Sur chaque push
  push:
    branches: [ main, develop ]
    paths: [ 'src/**', 'tests/**', '.github/workflows/exemple.yml' ]

  # Sur chaque pull request
  pull_request:
    branches: [ main ]

  # Manuellement depuis l'interface GitHub
  workflow_dispatch:

  # Sur un schedule (cron)
  schedule:
    - cron: '0 2 * * *'  # Chaque jour à 2h du matin

# Environnement et variables
env:
  PYTHON_VERSION: '3.11'
  R_VERSION: '4.3'

# Les jobs à exécuter
jobs:
  # Définir un job nommé "test"
  test:
    # Runner sur lequel exécuter ce job
    runs-on: ubuntu-latest

    # Strategy pour paralléliser
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    # Steps = tâches à exécuter
    steps:
      # Checkout le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v3

      # Configurer Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Exécuter une commande
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Exécuter les tests
      - name: Run tests
        run: pytest tests/ -v --cov=src

      # Télécharger le coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  # Deuxième job : linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics