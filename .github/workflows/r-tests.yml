name: Tests R

on:
  push:
    branches: [ main, develop ]
    paths: [ 'src/**', 'tests/**', 'DESCRIPTION', '.github/workflows/r-tests.yml' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        r-version: ['4.2', '4.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install dependencies
        run: |
          R -e "install.packages(c('testthat', 'roxygen2', 'lintr'))"

      - name: Run tests
        run: |
          R -e "library(testthat); source('tests/test_r.R')"

      - name: Generate test report
        if: always()
        run: |
          R -e "library(testthat);
                results <- test_dir('tests/', reporter = 'junit');
                junit_results <- as.data.frame(results)"

      - name: Check code style
        run: |
          R -e "library(lintr);
                lint_package('src/')"